<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FLX4 Fundamentals</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: black stage. Lesson text on the left, the controller on the right with its screen strip, caption line and transport. One typeface, no borders, depth from tone. */
:root{
  color-scheme:dark;
  --bg:#000; --s1:#0f0f11; --s2:#1c1c1f; --s3:#2c2c30; --s4:#48484d;
  --ink:#f5f5f7; --ink2:#a1a1a6; --ink3:#6e6e73;
  --hl:#ff4f9a; --ok:#30d158; --warn:#ff9f0a; --hot:#ff453a; --d1:#5ac8fa; --d2:#ff9f0a;
  --dev-ink:#b0b0b8; --dev-off:#1f1f22; --dev-slot:#060607;
  --scr-lane:#17171a; --scr-ink:#f5f5f7; --scr-dim:#77777d;
  --font:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:1560px;margin:0 auto;padding:14px clamp(16px,3vw,44px) 24px;display:flex;flex-direction:column;gap:16px}

.top{display:flex;align-items:center;gap:14px;min-height:44px}
.brand{font-size:1.05rem;font-weight:700;letter-spacing:-.01em;margin:0;white-space:nowrap}
.brand span{font-weight:500;color:var(--ink2)}
.overall{margin-left:auto;font-size:.84rem;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 14px;border:0;border-radius:999px;background:var(--s2);font-size:.9rem;font-weight:500;white-space:nowrap;min-width:0;transition:background .15s}
.crumb span{overflow:hidden;text-overflow:ellipsis}
.crumb svg,.nav svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.crumb svg{color:var(--ink2)}
.crumb:hover{background:var(--s3)}

.grid{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "booth" "body";gap:14px}
.head{grid-area:head;min-width:0}
.booth{grid-area:booth;min-width:0;display:flex;flex-direction:column;gap:10px}
.body{grid-area:body;min-width:0;display:flex;flex-direction:column;gap:18px}
@media (min-width:1000px){
  .grid{grid-template-columns:minmax(260px,350px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"head booth" "body booth";column-gap:clamp(24px,3.4vw,56px);row-gap:20px}
  .head{padding-top:clamp(8px,6vh,72px)}
  .booth{justify-self:center;width:min(100%,max(480px,calc((100vh - 306px)*1.7647)))}
  .foot{margin-top:auto}
}

.eyebrow{display:flex;align-items:baseline;gap:10px;font-size:.86rem;font-weight:500;color:var(--ink2)}
.eyebrow b{font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums}
.head h2{font-size:clamp(1.55rem,1.05rem + 1.5vw,2.4rem);font-weight:600;letter-spacing:-.028em;line-height:1.05;margin:8px 0 0;text-wrap:balance}
.in{animation:rise .34s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.screen{position:relative;display:grid;grid-template-columns:176px minmax(0,1fr);height:72px;background:var(--s1);border-radius:16px;overflow:hidden}
.reads{display:grid;grid-template-rows:1fr 1fr;min-width:0}
.read{display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;font-size:.78rem;min-width:0;white-space:nowrap}
.read .dk{flex:none;display:grid;place-items:center;width:18px;height:18px;border-radius:6px;font-style:normal;font-weight:700;font-size:.68rem;color:#000}
.read .dk.a{background:var(--d1)} .read .dk.b{background:var(--d2)}
.read .nm{color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.read .bpm{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.read .bar{color:var(--ink3);font-variant-numeric:tabular-nums;min-width:1.9em;text-align:right}
.lanebox{position:relative;min-width:0}
#lanes{position:absolute;inset:0;width:100%;height:100%;display:block}
.status{flex:none;margin-left:auto;display:flex;align-items:center;font-size:.84rem;font-weight:500;color:var(--ink2);white-space:nowrap}
.status::before{content:'';width:7px;height:7px;border-radius:50%;margin-right:7px;background:var(--ink3)}
.status.ok{color:var(--ink)} .status.ok::before{background:var(--ok)} .status.warn::before{background:var(--warn)}

.caps{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 12px;min-height:1.75rem;padding:0 4px}
.capA{font-weight:600;font-size:1.04rem;letter-spacing:-.01em}
.capA:not(:empty)::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--hl);margin-right:9px;vertical-align:.06em}
.capS{color:var(--ink2);font-size:.98rem}
@media (min-width:701px){ .caps{flex-wrap:nowrap} .capA{flex:none} .capS{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} }

.panel-wrap{position:relative;aspect-ratio:1200/680;border-radius:22px;overflow:hidden;background:#151517;box-shadow:0 0 0 1px rgba(255,255,255,.07),0 30px 70px -30px rgba(0,0,0,.9)}
.panel-wrap.tall{aspect-ratio:1/1}
#panel{width:100%;height:100%;display:block;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#panel text{font-family:var(--font);font-weight:600;letter-spacing:.02em;fill:var(--dev-ink);text-anchor:middle;pointer-events:none}
#panel .lbl{font-size:9px} #panel .big{font-size:12px} #panel .sub{font-size:7.5px;opacity:.75}
.plate{stroke:rgba(255,255,255,.08)} .fxp{fill:rgba(0,0,0,.16);stroke:rgba(255,255,255,.06)}
.ctl{cursor:pointer;transition:opacity .4s}
.decor{transition:opacity .4s}
#panel.dim .ctl:not(.hl):not(.lift):not(.sel),#panel.dim .decor{opacity:.5}
.ring{fill:none;stroke:var(--hl);stroke-width:2.5;opacity:0;pointer-events:none;transition:opacity .3s}
.ctl.hl .ring{opacity:.95;filter:drop-shadow(0 0 5px var(--hl))}
.ctl.sel .ring{opacity:1;stroke:#fff;filter:none}
.ringw{fill:none;stroke:var(--hl);opacity:0;pointer-events:none}
.ctl.hl .ringw{opacity:.28} .ctl.sel .ringw{opacity:.2;stroke:#fff}
.zone{fill:var(--hl);fill-opacity:0;stroke:var(--hl);stroke-width:2;opacity:0;pointer-events:none;transition:opacity .3s}
.zone.hl{opacity:1;fill-opacity:.05}
.sh{fill:#000;opacity:.5}
.btn{stroke:rgba(255,255,255,.09);stroke-width:1;transition:fill .08s}
.ctl.lit .btn{fill:var(--lit);stroke:var(--lit);filter:drop-shadow(0 0 7px var(--lit))}
.ctl.tap .btn{stroke:#fff;stroke-width:2.5}
.ico{fill:var(--dev-ink)}
#panel .ctl.lit text.on,.ctl.lit .ico{fill:#111}
.knob{stroke:rgba(255,255,255,.1);stroke-width:1} .kcap{fill:#3a3a40}
.encin{fill:#1f1f22;stroke:rgba(255,255,255,.08)}
.ptr{stroke:#fff;stroke-width:2.6;stroke-linecap:round}
.dot{fill:#5a5a61} .tick{stroke:#4a4a50;stroke-width:1}
.slot{fill:var(--dev-slot);stroke:rgba(255,255,255,.05)} .capl{stroke:#55555c;stroke-width:1.5}
.seg{fill:var(--dev-off)} .seg.g{fill:var(--ok)} .seg.o{fill:var(--warn)} .seg.r{fill:var(--hot)}
.edge{fill:none} .notch{fill:none;stroke:rgba(255,255,255,.13);stroke-dasharray:3 9.04}
.plat{stroke:rgba(255,255,255,.08)} .plat2{stroke:rgba(255,255,255,.05)}
.mark{stroke-width:4;stroke-linecap:round} .hub{fill:#1a1a1d;stroke:rgba(255,255,255,.1)} .hex{fill:none;stroke:#6a6a71;stroke-width:1.8}
.hit{fill:transparent} .hitring{fill:none;stroke:transparent;pointer-events:stroke}
.hand{pointer-events:none;opacity:0}
.hand .hr{fill:none;stroke:var(--hl);stroke-width:2.5}
.hand .hd{fill:#fff;fill-opacity:.3;stroke:#fff;stroke-width:1.5;transform-box:fill-box;transform-origin:center;transition:transform .09s,fill-opacity .09s}
.hand.down .hd{fill-opacity:.9;transform:scale(.82)}
.hand .hrip{fill:none;stroke:#fff;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.hand.down .hrip{animation:rip .55s ease-out}
@keyframes rip{from{opacity:.7;transform:scale(.8)}to{opacity:0;transform:scale(2.4)}}
.aim{fill:none;stroke:var(--hl);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#panel.try .ctl{touch-action:none}
#panel.try .ctl:hover .ring{opacity:.55;stroke:#fff;filter:none}
#panel.try .ctl.grab .ring{opacity:1;stroke:#fff;filter:none}

.bigplay{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0;border:0;background:none;font-size:.95rem;font-weight:600}
.bigplay .disc{display:grid;place-items:center;width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 14px 44px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.2);transition:transform .15s}
.bigplay:hover .disc{transform:scale(1.05)}
.bigplay .disc svg{width:38px;height:38px;fill:#fff;margin-left:4px}
.bigplay .t{padding:4px 13px;border-radius:999px;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tip{position:absolute;z-index:2;max-width:min(340px,calc(100% - 24px));padding:12px 15px 13px;border-radius:16px;background:rgba(34,34,38,.84);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.08);font-size:.92rem;line-height:1.42;color:#d6d6db;pointer-events:none}
.tip.t{top:12px} .tip.b{bottom:12px} .tip.l{left:12px} .tip.r{right:12px}
.tip b{display:block;color:var(--ink);font-weight:600;font-size:1rem;margin-bottom:2px}
.tip .sh2{display:block;margin-top:7px;color:var(--ink2)}
.tip .sh2 i,.copy b.k{font-style:normal;font-size:.8em;font-weight:600;letter-spacing:.04em;color:var(--ink);background:var(--s3);padding:.14em .5em;border-radius:6px;white-space:nowrap}
.tip .sh2 i{margin-right:7px}

.player{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 6px;background:var(--s1);border-radius:999px}
.pp{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:#000;transition:transform .12s}
.pp:active{transform:scale(.94)}
.pp svg{width:22px;height:22px;fill:currentColor}
.pp path,.icb path{display:none}
.pp[data-s=play] .i-play,.pp[data-s=pause] .i-pause,.pp[data-s=replay] .i-replay,.pp[data-s=reset] .i-replay,.pp[data-s=none] .i-play{display:block}
.pp:disabled{background:var(--s2);color:var(--ink3)}
.prog{flex:1;min-width:40px;height:4px;border-radius:2px;background:var(--s3);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ink);border-radius:2px}
.lab{font-size:.78rem;color:var(--ink3);margin-right:-4px}
.pick{display:flex;flex:none;padding:2px;border-radius:999px;background:var(--s2)}
.pick button{border:0;background:transparent;color:var(--ink2);font-size:.84rem;font-weight:500;height:32px;padding:0 13px;border-radius:999px;white-space:nowrap;transition:background .15s,color .15s}
.pick button[aria-pressed="true"]{background:var(--s4);color:var(--ink)}
.icb{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:0;background:var(--s2)}
.icb svg{width:19px;height:19px;fill:currentColor}
.icb[aria-pressed="true"] .i-on,.icb[aria-pressed="false"] .i-off{display:block}
.icb[aria-pressed="false"]{color:var(--ink3)}
@media (max-width:1180px){ .lab{display:none} }

.copy{font-size:1.0625rem;line-height:1.5;color:#c9c9cf;min-width:0}
.copy p{margin:0 0 .8em;max-width:40ch} .copy p:last-child{margin-bottom:0}
.copy b{font-weight:600;color:var(--ink)}
.copy b.k{position:relative;top:-.06em}
.copy .fine{font-size:.86rem;color:var(--ink3)}
.copy ul{list-style:none;margin:0 0 .8em;padding:0;display:grid;gap:.55em;max-width:42ch}
.copy ul:not(.todo) li{position:relative;padding-left:1.05em}
.copy ul:not(.todo) li::before{content:'';position:absolute;left:1px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--ink3)}
.copy ul.todo{gap:.8em;font-size:1rem}
.copy ul.todo label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.copy input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:none;width:22px;height:22px;margin:1px 0 0;border-radius:50%;border:1.5px solid var(--ink3);background:transparent;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.copy input[type=checkbox]:checked{background:var(--ink);border-color:var(--ink)}
.copy input[type=checkbox]:checked::after{content:'';width:10px;height:5px;border-left:2px solid #000;border-bottom:2px solid #000;transform:translateY(-1.5px) rotate(-45deg)}
.copy input:checked + span{color:var(--ink3)}
.tw{overflow-x:auto;margin-bottom:.7em}
table.st{border-collapse:collapse;width:100%;font-size:.9rem}
table.st th,table.st td{text-align:left;padding:7px 12px 7px 0;border-bottom:1px solid var(--s2);vertical-align:top}
table.st th{font-size:.76rem;color:var(--ink3);font-weight:500}
table.st td:first-child{color:var(--ink);font-weight:500}
table.st td:nth-child(2){font-variant-numeric:tabular-nums;white-space:nowrap}
.padmap{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:250px;margin:.2em 0 .9em}
.padmap span{background:var(--s2);border-radius:9px;text-align:center;padding:9px 0;font-size:.82rem;font-weight:500;color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:.2em 0 .9em}
.tags span{font-size:.74rem;font-weight:500;letter-spacing:.02em;background:var(--s2);border-radius:7px;padding:3px 9px;color:var(--ink)}
.tags span.q{background:none;color:var(--ink2);padding-left:0}

.pass button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border:0;border-radius:16px;background:var(--s1);font-size:.98rem;font-weight:500;text-align:left;transition:background .15s}
.pass button:hover{background:var(--s2)}
.pass i{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink3)}
.pass button[aria-pressed="true"] i{background:var(--ok);border-color:var(--ok)}
.pass button[aria-pressed="true"] i::after{content:'';width:10px;height:5px;border-left:2px solid #000;border-bottom:2px solid #000;transform:translateY(-1.5px) rotate(-45deg)}

.foot{display:flex;flex-direction:column;gap:10px}
.segs{display:flex;gap:4px}
.segs button{flex:1;min-width:3px;height:19px;padding:0;border:0;background:none}
.segs button::after{content:'';display:block;height:3px;border-radius:2px;background:var(--s3);transition:background .2s}
.segs button.seen::after{background:var(--ink3)} .segs button.cur::after{background:var(--ink)}
.nav{display:flex;gap:10px}
.nav button{display:grid;place-items:center;height:48px;border:0;border-radius:999px;font-size:1rem;font-weight:600;transition:transform .12s,background .15s,opacity .15s}
.nav button:active:not(:disabled){transform:scale(.97)}
#prev{flex:none;width:48px;background:var(--s2)} #prev:hover:not(:disabled){background:var(--s3)}
.next{flex:1;background:var(--ink);color:#000}
.nav button:disabled{opacity:.35}
.keys{font-size:.76rem;color:var(--ink3)}
@media (max-width:999px){ .keys{display:none} }

.scrim{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.5)}
.sheet{position:fixed;z-index:9;top:calc(env(safe-area-inset-top,0px) + 62px);right:clamp(16px,3vw,44px);width:min(400px,calc(100vw - 32px));max-height:calc(100vh - 86px);overflow-y:auto;padding:8px;border-radius:22px;background:rgba(30,30,33,.86);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 24px 70px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.08);animation:rise .22s cubic-bezier(.2,.7,.2,1) both}
.sheet-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px 8px;font-weight:600}
.sheet-h span{font-weight:500;font-size:.84rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.sess{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:9px 12px;border:0;border-radius:14px;background:none;text-align:left;transition:background .12s}
.sess:hover{background:rgba(255,255,255,.06)}
.sess.cur{background:rgba(255,255,255,.1)}
.sess .n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums}
.sess.done .n{background:var(--ok);color:#000}
.sess .nm{font-weight:600;font-size:.98rem;line-height:1.25}
.sess .sb{display:block;font-weight:400;font-size:.82rem;color:var(--ink2)}
.sess .ct{font-size:.78rem;color:var(--ink3);font-variant-numeric:tabular-nums}
.opts{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.08)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:14px;background:none;font-size:.95rem;text-align:left}
.sw i{flex:none;position:relative;width:44px;height:26px;border-radius:13px;background:var(--s4);transition:background .2s}
.sw i::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sw[aria-checked="true"] i{background:var(--ok)}
.sw[aria-checked="true"] i::after{transform:translateX(18px)}

.midi{flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:0;border-radius:999px;background:var(--s2);font-size:.9rem;font-weight:500;white-space:nowrap;transition:background .15s}
.midi:hover{background:var(--s3)}
.midi i{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.midi.on i{background:var(--ok)} .midi.err i{background:var(--warn)}
.drill{background:var(--s1);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dr-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:600}
.dr-h span{font-weight:500;font-size:.82rem;color:var(--ink3);font-variant-numeric:tabular-nums}
.dr-list{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.dr-list:empty{display:none}
.dr-list li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;font-size:.94rem;line-height:1.35;color:var(--ink3)}
.dr-list li.tog{margin-top:-3px}
.dr-list li i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--s4);font-style:normal;font-size:.72rem;font-weight:600;font-variant-numeric:tabular-nums}
.dr-list li.cur{color:var(--ink)} .dr-list li.cur i{border-color:var(--hl);color:var(--hl)}
.dr-list li.ok{color:var(--ink2)} .dr-list li.ok i{background:var(--ok);border-color:var(--ok)}
.dr-list li.ok i::after{content:'';width:9px;height:4.5px;border-left:2px solid #000;border-bottom:2px solid #000;transform:translateY(-1px) rotate(-45deg)}
.dr-list li.bad{color:var(--ink)} .dr-list li.bad i{background:var(--hot);border-color:var(--hot);color:#000}
.dr-list em{font-style:normal;font-size:.72rem;font-weight:600;letter-spacing:.02em;color:var(--ink);background:var(--s3);padding:.12em .5em;border-radius:6px;white-space:nowrap;margin-left:4px;vertical-align:.08em}
.dr-list li:not(.cur):not(.bad) em{color:var(--ink3);background:var(--s2)}
.dr-list .dn{height:26px;padding:0 11px;border:0;border-radius:999px;background:var(--ink);color:#000;font-size:.8rem;font-weight:600}
.dr-msg{font-size:.9rem;color:var(--ink2);line-height:1.4}
.dr-msg:empty{display:none}
.dr-msg.bad{color:#ff8a80} .dr-msg.good{color:var(--ok);font-weight:600}
.dr-act{display:flex;gap:8px;flex-wrap:wrap}
.dr-act button{height:38px;padding:0 16px;border:0;border-radius:999px;background:var(--s2);font-size:.92rem;font-weight:500;transition:background .15s}
.dr-act button:hover{background:var(--s3)}
.dr-act button.pri{background:var(--ink);color:#000;font-weight:600}
.segs button.aced::after{background:var(--ok)}
.segs button.aced.cur::after{background:var(--ink)}
#panel.learn .ctl{cursor:crosshair}
#panel.learn .ctl:hover .ring{opacity:.6;stroke:#fff;filter:none}
.mbody{padding:2px 12px 10px;font-size:.92rem;line-height:1.45;color:var(--ink2)}
.mbody p{margin:0}
.mlast{margin-top:10px;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.06);font:500 .8rem ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);overflow-wrap:anywhere}
.row{display:block;width:100%;padding:11px 12px;border:0;border-radius:14px;background:none;font-size:.95rem;text-align:left}
.row:hover{background:rgba(255,255,255,.06)}
.row.pri{background:var(--ink);color:#000;font-weight:600;text-align:center;margin-bottom:4px}
@media (max-width:700px){
  .app{padding-block:10px calc(88px + env(safe-area-inset-bottom,0px));gap:12px}
  .grid{gap:12px}
  .brand span,.overall{display:none}
  .midi{margin-left:auto}
  .head h2{margin-top:4px}
  .screen{grid-template-columns:104px minmax(0,1fr);height:60px;border-radius:14px}
  .read{padding:0 8px;gap:6px;font-size:.74rem} .read .nm{display:none} .read .bpm{margin-left:0}
  .caps{display:grid;grid-template-columns:minmax(0,1fr) auto;align-content:start;gap:0 10px;min-height:3.1rem}
  .capA{grid-column:1/-1}
  .status{align-self:start;font-size:.78rem;line-height:1.5}
  .capS{font-size:.94rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .panel-wrap{border-radius:18px}
  .player{flex-wrap:wrap;gap:8px;padding:8px;border-radius:22px}
  .prog{flex:1 1 calc(100% - 104px)}
  .icb{order:1}
  .pick{order:2;flex:1 1 auto} .pick button{flex:1;padding:0 8px}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.74);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
  .sheet{top:auto;right:0;left:0;bottom:0;width:auto;max-height:82vh;border-radius:24px 24px 0 0;padding:10px 10px calc(14px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){ .in,.sheet,.hand.down .hrip{animation:none} *{transition-duration:.01s !important} }

<script>
(() => {
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const svg = $('#panel');

/* ---------- the controller: every control, where it sits and what it does ---------- */
const C = {}, ids = [];
const add = (id, o) => { o.id = id; C[id] = o; ids.push(id); };
const AMB = '#ff9f0a', GRN = '#30d158', BLU = '#5ac8fa', WHT = '#f5f5f7', RED = '#ff453a', VIO = '#bf5af2';

function deck(n, ox) {
  const p = 'd' + n + '-', c = s => 'D' + n + ' ' + s;
  add(p + 'in', {t:'round', x:ox+46, y:62, r:17, lab:'IN', sub:'IN ADJUST', lc:AMB, c:c('IN'), name:'IN', d:'Sets the start of a manual loop. During a loop, press it and turn the jog wheel to move the loop start.'});
  add(p + 'out', {t:'round', x:ox+100, y:62, r:17, lab:'OUT', sub:'OUT ADJUST', lc:AMB, c:c('OUT'), name:'OUT', d:'Sets the end of a manual loop and starts it looping. During a loop, press it and turn the jog wheel to move the loop end.'});
  add(p + '4beat', {t:'round', x:ox+160, y:62, r:17, lab:'4 BEAT/EXIT', sub:'ACTIVE', lc:AMB, c:c('4 BEAT/EXIT'), name:'4 BEAT/EXIT', d:'Starts a 4-beat loop from where you press it. Press it again to leave the loop.', sh:'Sets or cancels Active Loop on the nearest saved loop.'});
  add(p + 'call-l', {t:'round', x:ox+228, y:62, r:12, tri:-1, sub:'DELETE', c:c('CALL ◄'), name:'CUE/LOOP CALL ◄', d:'During a loop, halves its length. Otherwise it calls up a saved cue or loop point.', sh:'Deletes the called-up point.'});
  add(p + 'call-r', {t:'round', x:ox+264, y:62, r:12, tri:1, sub:'MEMORY', c:c('CALL ►'), name:'CUE/LOOP CALL ►', d:'During a loop, doubles its length. Otherwise it calls up a saved cue or loop point.', sh:'Saves the current cue or loop point.'});
  add(p + 'sync', {t:'round', x:ox+344, y:62, r:17, lab:'BEAT SYNC', sub:'TEMPO RANGE', lc:WHT, c:c('BEAT SYNC'), name:'BEAT SYNC', d:'Matches this deck’s tempo and beatgrid to the master deck. Press again to cancel. Hold for a second to make this deck the master.', sh:'Steps the TEMPO slider range through ±6%, ±10%, ±16% and WIDE.'});
  add(p + 'jog-edge', {t:'ring', x:ox+190, y:285, r:138, w:24, c:c('JOG EDGE'), name:'Jog wheel, outer edge', d:'Pitch bend. Push it forwards to nudge the track ahead, drag it back to hold the track behind. The change lasts only while you turn.'});
  add(p + 'jog', {t:'jog', x:ox+190, y:285, r:124, n:n, c:c('JOG TOP'), name:'Jog wheel, top', d:'With Vinyl mode on, moving the top scratches the track, or positions it while paused.', sh:'Turn to search quickly through the track.'});
  add(p + 'shift', {t:'rect', x:ox+46, y:476, w:46, h:22, lab:'SHIFT', lc:WHT, c:c('SHIFT'), name:'SHIFT', d:'Hold it and press another control to use that control’s second function, printed in small letters beneath it.'});
  [['hotcue','HOT CUE','KEYBOARD','Hot Cue mode: the pads store and recall points in the track.','Keyboard mode: play a hot cue at different pitches.'],
   ['padfx','PAD FX1','PAD FX2','Pad FX mode: an effect plays for as long as you hold a pad.','A second bank of pad effects.'],
   ['beatjump','BEAT JUMP','BEAT LOOP','Beat Jump mode: the pads move the playhead by a set number of beats.','Beat Loop mode: the pads start loops from 1/4 beat to 32 beats.'],
   ['sampler','SAMPLER','KEY SHIFT','Sampler mode: the pads fire sounds loaded in rekordbox’s sampler.','Key Shift mode: the pads change the key of the playing track.']
  ].forEach((m, i) => add(p + 'mode-' + m[0], {t:'rect', x:ox+125+i*56, y:510, w:46, h:15, lab:m[1], sub:m[2], lc:WHT, c:c(m[1]), name:m[1] + ' mode button', d:m[3], sh:m[4]}));
  for (let i = 0; i < 8; i++) add(p + 'pad' + (i+1), {t:'pad', x:ox+100+(i%4)*56, y:544+(i>3?56:0), w:50, h:50, lc:BLU, pad:i+1, dk:n, name:'Performance pad ' + (i+1), d:'What it does depends on the pad mode: a hot cue, a held effect, a beat jump, a loop or a sample.'});
  add(p + 'cue', {t:'round', x:ox+46, y:568, r:26, txt:'CUE', lc:AMB, c:c('CUE'), name:'CUE', d:'Paused: sets the cue point here. Playing: jumps back to the cue point and stops. Held: plays from the cue point until you let go.', sh:'Returns to the start of the track.'});
  add(p + 'play', {t:'round', x:ox+46, y:628, r:26, icon:1, sub:'PLAY/PAUSE', lc:GRN, c:c('PLAY/PAUSE'), name:'PLAY/PAUSE', d:'Starts and stops the track.'});
  add(p + 'tempo', {t:'vslide', x:ox+360, y:480, len:160, lab:'TEMPO', c:c('TEMPO'), name:'TEMPO slider', d:'Sets the playing speed. Towards you is faster, away from you is slower.'});
}
deck(1, 0);
const MX = 400, FX = 745;
add('load1', {t:'rect', x:MX+72, y:30, w:52, h:18, txt:'LOAD', c:'LOAD 1', name:'LOAD (deck 1)', d:'Loads the selected track onto deck 1. Press twice to copy the other deck’s track and position.'});
add('browse', {t:'enc', x:MX+145, y:31, r:17, c:'ROTARY SELECTOR', name:'Rotary selector', d:'Turn to move through your library. Press to switch between the folder tree and the track list.', sh:'Turn to zoom the waveform in rekordbox.'});
add('load2', {t:'rect', x:MX+218, y:30, w:52, h:18, txt:'LOAD', c:'LOAD 2', name:'LOAD (deck 2)', d:'Loads the selected track onto deck 2. Press twice to copy the other deck’s track and position.'});
add('mic', {t:'knob', x:MX+44, y:232, r:14, lab:'MIC LEVEL', c:'MIC LEVEL', name:'MIC LEVEL', d:'Volume of a microphone plugged into the rear MIC input. Keep it at minimum when no microphone is connected.'});
add('smartcfx', {t:'round', x:MX+44, y:352, r:13, sub:'SMART CFX', lc:BLU, c:'SMART CFX', name:'SMART CFX', d:'Switches the CFX knobs from a plain filter to a preset chain of effects.', sh:'Opens the preset list in rekordbox.'});
add('hpmix', {t:'knob', x:MX+44, y:432, r:14, lab:'PHONES MIX', l:'CUE', rr:'MASTER', c:'HEADPHONES MIX', name:'HEADPHONES MIX', d:'Balances your headphones between the channels you have cued (left) and what the room hears (right).'});
add('hplevel', {t:'knob', x:MX+44, y:502, r:14, lab:'PHONES LEVEL', c:'HEADPHONES LEVEL', name:'HEADPHONES LEVEL', d:'Headphone volume.'});
add('smartfader', {t:'round', x:MX+44, y:574, r:13, sub:'SMART FADER', lc:BLU, c:'SMART FADER', name:'SMART FADER', d:'When on, moving a fader also shifts the BPM, swaps the bass and adds an echo for you. It turns Beat Sync on.'});
[1, 2].forEach(ch => {
  const x = MX + (ch === 1 ? 128 : 232);
  add('trim' + ch, {t:'knob', x:x, y:98, r:14, lab:'TRIM', c:'TRIM ' + ch, name:'TRIM (channel ' + ch + ')', d:'Input level for this channel. Use it to match tracks to each other: the level indicator should just reach orange on the loudest part.'});
  add('hi' + ch, {t:'knob', x:x, y:162, r:15, lab:'HI', c:'HI ' + ch, name:'EQ HI (channel ' + ch + ')', d:'Boosts or cuts the high frequencies: hi-hats and cymbals.'});
  add('mid' + ch, {t:'knob', x:x, y:226, r:15, lab:'MID', c:'MID ' + ch, name:'EQ MID (channel ' + ch + ')', d:'Boosts or cuts the middle frequencies: most vocals and melody.'});
  add('low' + ch, {t:'knob', x:x, y:290, r:15, lab:'LOW', c:'LOW ' + ch, name:'EQ LOW (channel ' + ch + ')', d:'Boosts or cuts the low frequencies: kick and bass. This is the main EQ for mixing.'});
  add('cfx' + ch, {t:'knob', x:x, y:354, r:16, lab:'CFX', c:'CFX ' + ch, name:'CFX (channel ' + ch + ')', d:'With SMART CFX off, a filter by default: left removes highs, right removes lows, centre is off. With SMART CFX on, it drives the chosen preset.'});
  add('hcue' + ch, {t:'rect', x:x, y:412, w:46, h:20, txt:'CUE', lc:AMB, c:'CUE ' + ch, name:'Headphones CUE (channel ' + ch + ')', d:'Sends this channel to your headphones, whether or not its fader is up.', sh:'Tap in time to set the deck’s tempo by hand.'});
  add('fader' + ch, {t:'vfade', x:x, y:590, len:124, c:'FADER ' + ch, name:'Channel fader ' + ch, d:'Volume of this channel in the room.', sh:'Fader Start: sliding it up starts the deck from its cue point.'});
  add('meter' + ch, {t:'meter', x:MX + (ch === 1 ? 170 : 190), y:150, c:'LEVEL ' + ch, name:'Channel level indicator ' + ch, d:'Shows the channel’s level before its fader. Set TRIM so the loudest part just reaches orange.'});
});
add('xfader', {t:'hfade', x:MX+120, y:642, len:120, c:'CROSSFADER', name:'Crossfader', d:'Blends between deck 1 on the left and deck 2 on the right.', sh:'Fader Start: moving it starts the deck on the other side from its cue point.'});
add('master', {t:'knob', x:FX, y:100, r:14, lab:'MASTER LEVEL', c:'MASTER LEVEL', name:'MASTER LEVEL', d:'Volume sent to the speakers. This is your room volume.'});
add('mastercue', {t:'rect', x:FX, y:160, w:46, h:20, txt:'CUE', lc:AMB, c:'MASTER CUE', name:'Headphones CUE (master)', d:'Sends the master output to your headphones.'});
add('fx-ch', {t:'sw3', x:FX, y:262, w:46, c:'CH SELECT', name:'BEAT FX CH SELECT', d:'Chooses which channel the Beat FX is applied to: 1, 2, or both.'});
add('fx-select', {t:'rect', x:FX, y:324, w:46, h:18, lab:'FX SELECT', c:'FX SELECT', name:'BEAT FX SELECT', d:'Steps to the next Beat FX each time you press it.', sh:'Steps backwards through the list.'});
add('fx-beat-l', {t:'rect', x:FX-18, y:386, w:30, h:18, tri:-1, sub:'AUTO', c:'BEAT ◄', name:'BEAT ◄', d:'Shortens the effect’s length in beats.', sh:'BPM Auto: the effect follows the track’s BPM.'});
add('fx-beat-r', {t:'rect', x:FX+18, y:386, w:30, h:18, tri:1, sub:'TAP', c:'BEAT ►', name:'BEAT ►', d:'Lengthens the effect’s length in beats.', sh:'BPM Tap: tap to set the effect’s tempo by hand.'});
add('fx-depth', {t:'knob', x:FX, y:468, r:16, lab:'LEVEL/DEPTH', l:'MIN', rr:'MAX', c:'LEVEL/DEPTH', name:'BEAT FX LEVEL/DEPTH', d:'How strongly the Beat FX is applied.'});
add('fx-onoff', {t:'round', x:FX, y:552, r:18, lab:'ON/OFF', sub:'RELEASE FX', lc:BLU, c:'FX ON/OFF', name:'BEAT FX ON/OFF', d:'Turns the Beat FX on and off. It flashes while on.', sh:'Turns the effect off with a Release FX.'});
deck(2, 800);

const Z = {'z-deck1':[12,12,380,656], 'z-mixer':[406,58,284,610], 'z-fx':[700,204,90,398], 'z-deck2':[808,12,380,656]};


function draw(o) {
  const x = o.x, y = o.y;
  const T = (tx, ty, s, c) => '<text class="' + (c || 'lbl') + '" x="' + tx + '" y="' + ty + '">' + s + '</text>';
  const tri = (tx, ty, d) => '<path class="ico" d="M' + (tx - 4*d) + ' ' + (ty - 5) + 'l' + (8*d) + ' 5l' + (-8*d) + ' 5z"/>';
  let ring = '', h = '', hit = '', over = false;
  if (o.t === 'round') {
    const r = o.r;
    ring = '<circle class="ring" cx="' + x + '" cy="' + y + '" r="' + (r + 7) + '"/>';
    h = '<circle class="sh" cx="' + x + '" cy="' + (y + 2.5) + '" r="' + (r + 1) + '"/><circle class="btn" fill="url(#gBtn)" cx="' + x + '" cy="' + y + '" r="' + r + '"/>';
    if (o.txt) h += T(x, y + 4.5, o.txt, 'lbl big on');
    if (o.icon) h += '<path class="ico" d="M' + (x-10) + ' ' + (y-8) + 'l11 8l-11 8zM' + (x+4) + ' ' + (y-8) + 'h3v16h-3zM' + (x+10) + ' ' + (y-8) + 'h3v16h-3z"/>';
    if (o.tri) h += tri(x, y, o.tri);
    if (o.lab) h += T(x, y - r - 7, o.lab);
    if (o.sub) h += T(x, y + r + 11, o.sub, 'sub');
    hit = '<circle class="hit" cx="' + x + '" cy="' + y + '" r="' + Math.max(r + 5, 19) + '"/>';
    o.bb = [x - r - 8, y - r - 8, 2*r + 16, 2*r + 16];
  } else if (o.t === 'rect') {
    const w = o.w, hh = o.h, th = Math.max(hh, 26) + 4;
    ring = '<rect class="ring" x="' + (x - w/2 - 6) + '" y="' + (y - hh/2 - 6) + '" width="' + (w + 12) + '" height="' + (hh + 12) + '" rx="9"/>';
    h = '<rect class="sh" x="' + (x - w/2) + '" y="' + (y - hh/2 + 2) + '" width="' + w + '" height="' + hh + '" rx="5"/><rect class="btn" fill="url(#gBtn)" x="' + (x - w/2) + '" y="' + (y - hh/2) + '" width="' + w + '" height="' + hh + '" rx="5"/>';
    if (o.txt) h += T(x, y + 3.5, o.txt, 'lbl on');

der.</p>"},{"t":"Fader up, then master","pre":{"d1":{"track":"A","at":64,"play":true},"d2":null},"demo":[[1,"move","fader1",1,3],[5,"move","master",0.5,4],[6,"say","Sound arrives with MASTER LEVEL."]],"len":14,"b":"<p>Channel fader to the top. Then raise [[MASTER LEVEL]] to a comfortable volume.</p><p>Room volume is MASTER LEVEL’s job. TRIM only matches tracks.</p>"},{"t":"Second track, fader down","pre":{"d1":{"track":"A","at":96,"play":true},"d2":null},"demo":[[1,"load",2,{"track":"B","at":32,"sync":true}],[5,"press","d2-play"],[6,"say","Deck 2 is running. The room hears only deck 1."]],"len":12,"b":"<p>Load deck 2 and press [[PLAY/PAUSE]]. Keep its fader down.</p>"},{"t":"Cue deck 2","pre":{"d1":{"track":"A","at":96,"play":true},"d2":{"track":"B","at":32,"play":true,"sync":true},"listen":"room"},"demo":[[1,"press","hcue2"],[3,"listen","phones"],[3,"move","hplevel",0.5,3],[4,"say","Headphones: deck 2 fades in."]],"len":13,"b":"<p>Press channel 2 [[CUE]] and raise [[HEADPHONES LEVEL]].</p><p>Deck 2 is in your ears, not in the room.</p>"},{"t":"Sweep the mix","pre":{"d1":{"track":"A","at":96,"play":true},"d2":{"track":"B","at":32,"play":true,"sync":true},"lit":{"hcue2":1},"set":{"hpmix":0.5,"hplevel":0.5},"listen":"phones"},"demo":[[1,"move","hpmix",0,3],[4,"say","CUE: deck 2 alone."],[9,"move","hpmix",1,3],[12,"say","MASTER: what the room hears."],[17,"move","hpmix",0.5,2],[19,"say","Middle: both. Your default."]],"len":23,"b":"<p>[[HEADPHONES MIX]] left: deck 2 alone. Right: the room.</p><p>Park it in the middle.</p>"},{"t":"Match the levels","pre":{"d1":{"track":"A","at":96,"play":true},"d2":{"track":"B","at":32,"play":true,"sync":true},"lit":{"hcue2":1},"set":{"trim2":0.3,"hpmix":0,"hplevel":0.5},"listen":"phones"},"demo":[[0,"say","Deck 2 alone, and too quiet."],[2,"move","trim2",0.6,5],[8,"say","Now it peaks level with deck 1."]],"len":13,"b":"<p>Set deck 2’s [[TRIM]] so it peaks level with deck 1.</p><p>Repeat with five tracks. Quiet recordings need more.</p>"},{"t":"What each EQ removes","pre":{"d1":{"track":"A","at":160,"play":true},"d2":null,"lit":{"hcue2":0},"set":{"hpmix":0.5},"listen":"room"},"demo":[[1,"move","low1",0,1.5],[2,"say","LOW out: kick and bass go."],[6,"move","low1",0.5,1.5],[9,"move","mid1",0,1.5],[10,"say","MID out: chords and lead go."],[14,"move","mid1",0.5,1.5],[17,"move","hi1",0,1.5],[18,"say","HI out: hi-hats go."],[22,"move","hi1",0.5,1.5]],"len":26,"b":"<ul><li>[[LOW]] takes the kick and bass.</li><li>[[MID]] takes vocals and melody.</li><li>[[HI]] takes the hi-hats.</li></ul><p>Turn each fully left and back. Say what vanished.</p>"},{"t":"The filter","pre":{"d1":{"track":"A","at":160,"play":true},"d2":null},"demo":[[1,"move","cfx1",0.08,4],[2,"say","Left: muffled."],[6,"move","cfx1",0.5,2],[9,"move","cfx1",0.92,4],[10,"say","Right: thin."],[14,"move","cfx1",0.5,2]],"len":18,"b":"<p>Sweep [[CFX]] left, right, then back to centre.</p><p>Left cuts highs. Right cuts lows.</p>"},{"t":"Pass check","pass":1,"b":"<p>One track in the room. Cue a second in your headphones and match its level in 30 seconds.</p>"}],"sub":"Gain, EQ and headphones"},{"id":"s2","nm":"Phrases","init":{"fader1":1},"steps":[{"t":"Beats, bars, phrases","pre":{"d1":{"track":"A","at":28,"play":true},"d2":null},"demo":[[0,"say","Count: 8-2-3-4…"],[4,"say","The one. Claps and hats enter."],[32,"say","8-2-3-4…"],[36,"say","The one. The bass enters."]],"len":44,"b":"<p>4 beats make a bar. 8 bars make a phrase. Music changes on the first beat of a phrase: <b>the one</b>.</p><p>On the strip, tall blocks start a bar and the white block is the one.</p>"},{"t":"Count out loud","pre":{"d1":{"track":"A","at":0,"play":false},"d2":null},"demo":[[1,"press","d1-play"],[1,"say","Bar 1 of 8. Follow the numbers."],[29,"say","8-2-3-4…"],[33,"say","The one. Something new arrives."]],"len":40,"b":"<p>Count bars: 1-2-3-4, 2-2-3-4, up to 8. The next beat is the one.</p><p>At each one, name what changed.</p>"},{"t":"Other styles","pre":{"d1":{"track":"C","at":12,"play":true},"d2":null},"demo":[[0,"say","Hip-hop, 95 BPM. A change every 4 bars."],[4,"say","Bass and keys come in."],[20,"say","And again."]],"len":28,"b":"<p>Hip-hop, pop and afrobeats often change every 4 bars, not 8.</p><p>Count one of each.</p>"},{"t":"Check the grid","pre":{"d1":{"track":"A","at":0,"play":false},"d2":null},"demo":[[1,"combo","d1-shift","browse"],[1,"say","SHIFT + rotary selector zooms the waveform."]],"len":6,"b":"<p>[[SHIFT]] + rotary selector zooms the waveform. Grid lines should sit on the kicks.</p><p>Fix a bad grid in rekordbox. Sync depends on it.</p>"},{"t":"Pads to hot cues","pre":{"d1":{"track":"A","at":0,"play":false,"mode":"beatjump"},"d2":null},"demo":[[1,"press","d1-mode-hotcue"]],"len":5,"b":"<p>Press [[HOT CUE]]. The pads now store points in the track.</p>"},{"t":"Mark four points","pre":{"d1":{"track":"A","at":0,"play":false},"d2":null},"demo":[[1,"press","d1-pad1"],[1,"say","Pad 1: the first beat."],[3,"press","d1-play"],[5,"skip",1,62],[7,"press","d1-pad2"],[7,"say","Pad 2: the bass enters."],[9,"skip",1,158],[11,"press","d1-pad3"],[11,"say","Pad 3: the drop."],[13,"skip",1,222],[15,"press","d1-pad4"],[15,"say","Pad 4: the outro."]],"len":20,"b":"<ul><li><b>Pad 1</b> the first beat</li><li><b>Pad 2</b> the bass enters</li><li><b>Pad 3</b> the drop</li><li><b>Pad 4</b> the outro</li></ul><p>[[SHIFT]] + pad clears one. Do five tracks.</p>"},{"t":"Test your marks","pre":{"d1":{"track":"A","at":100,"play":true,"hot":{"1":0,"2":64,"3":160,"4":224}},"d2":null},"demo":[[4,"press","d1-pad3"],[4,"say","Pad 3: the drop."],[12,"press","d1-pad4"],[12,"say","Pad 4: the outro."],[20,"press","d1-pad2"],[20,"say","Pad 2: the bass."]],"len":28,"b":"<p>Play and press each pad. Each should land on a one.</p>"},{"t":"Read the waveform","b":"<p>Find the same points by shape. Thin is an intro or breakdown. Dense is a drop.</p>"},{"t":"Pass check","pass":1,"b":"<p>A track you have not prepared, eyes off the screen. Call every phrase change one beat early, for two minutes.</p>"}],"sub":"Hear where music changes"},{"id":"s3","nm":"On the one","init":{"fader1":1},"steps":[{"t":"Why the one matters","lock":1,"pre":{"d1":{"track":"A","at":60,"play":true},"d2":{"track":"A","label":"A (copy)","at":0,"play":false},"set":{"fader2":1},"listen":"room"},"demo":[[0,"say","Deck 2: a copy, cued at its first beat."],[4,"press","d2-play"],[5,"say","Started on the one. They change together."]],"len":16,"b":"<p>Start B on A’s one and both tracks change together for the whole mix.</p><p>This session drills timing only: two copies of one track, so tempo is not a problem.</p>"},{"t":"Set the cue point","pre":{"d1":{"track":"A","at":64,"play":true},"d2":{"track":"A","label":"A (copy)","at":3.4,"play":false},"set":{"fader2":0}},"demo":[[1,"scrub",2,0,3],[5,"press","d2-cue"],[5,"say","That is now the cue point."]],"len":9,"b":"<p>Turn the jog top until the playhead sits on the first kick. Press [[CUE]].</p>"},{"t":"Rehearse with CUE","pre":{"d1":{"track":"A","at":64,"play":true},"d2":{"track":"A","label":"A (copy)","at":0,"play":false},"set":{"hpmix":0.5,"hplevel":0.5},"lit":{"hcue2":1},"listen":"phones"},"demo":[[0,"say","Headphones. Hold CUE for one beat."],[4,"hold","d2-cue",1],[8,"hold","d2-cue",1],[12,"hold","d2-cue",1],[16,"hold","d2-cue",1]],"len":20,"b":"<p>Hold [[CUE]] for a beat, in time with deck 1. Held, it plays. Released, it snaps back.</p><p>Repeat until two kicks sound like one.</p>"},{"t":"Play on the one","lock":1,"pre":{"d1":{"track":"A","at":60,"play":true},"d2":{"track":"A","label":"A (copy)","at":0,"play":false},"lit":{"hcue2":1},"listen":"phones"},"demo":[[0,"say","Count: 8-2-3-4…"],[4,"press","d2-play"],[5,"say","One clean kick. On time."]],"len":14,"b":"<p>Count the phrase. On the one, press [[PLAY/PAUSE]].</p><p>One clean kick: on time. A double hit: early or late.</p>"},{"t":"Reset, repeat","lock":1,"pre":{"d1":{"track":"A","at":60,"play":true},"d2":{"track":"A","label":"A (copy)","at":0,"play":false},"lit":{"hcue2":1},"listen":"phones"},"demo":[[4,"press","d2-play"],[10,"press","d2-cue"],[10,"say","CUE jumps back. Wait for the next one."],[32,"say","8-2-3-4…"],[36,"press","d2-play"]],"len":42,"b":"<p>[[CUE]] jumps back and stops. Do 20 starts. Count the clean ones.</p>"},{"t":"A late start","lock":1,"pre":{"d1":{"track":"A","at":60,"play":true},"d2":{"track":"A","label":"A (copy)","at":0,"play":false},"lit":{"hcue2":1},"listen":"phones"},"demo":[[4.22,"press","d2-play"],[5,"say","Late. Hear the double kick."]],"len":14,"b":"<p>Deck 2 started late. Its beats trail.</p><p>Fix it on the jog edge: push forwards to catch up, drag back to slow down.</p>"},{"t":"Nudge it in","lock":1,"pre":{"d1":{"track":"A","at":68,"play":true},"d2":{"track":"A","label":"A (copy)","at":3.78,"play":true},"lit":{"hcue2":1},"listen":"phones"},"demo":[[0,"say","Deck 2 is trailing."],[4,"nudge",2,0.22,4],[9,"say","Locked."]],"len":16,"b":"<p>A short push and the beats line up. Nobody hears it.</p>"},{"t":"Two different tracks","lock":1,"pre":{"d1":{"track":"A","at":56,"play":true},"d2":{"track":"B","at":0,"hot":{"1":0}},"set":{"fader2":1},"lit":{"hcue2":0},"listen":"room"},"demo":[[1,"press","d2-sync"],[1,"say","BEAT SYNC matches the tempo."],[8,"press","d2-pad1"],[8,"say","Pad 1, on the one."]],"len":20,"b":"<p>Press [[BEAT SYNC]] on the new deck so tempo is handled. Start it from pad 1 on the one.</p>"},{"t":"Pass check","pass":1,"b":"<p>Nine clean starts out of ten, with both tracks changing phrase on the same beat.</p>"}],"sub":"Start a track in time"},{"id":"s4","nm":"Beatmatching","init":{"fader1":1},"steps":[{"t":"Two jobs","lock":1,"pre":{"d1":{"track":"A","at":64,"play":true},"d2":{"track":"A","label":"A (copy)","at":0,"play":true},"set":{"hpmix":0.5,"hplevel":0.5},"lit":{"hcue2":1},"listen":"phones"},"demo":[[0,"say","Both decks in the headphones, locked."],[3,"touch","d2-tempo",1.5],[3,"say","TEMPO: equal speeds."],[7,"touch","d2-jog-edge",1.5],[7,"say","Jog edge: beats lined up."]],"len":12,"b":"<p>[[TEMPO]] makes the speeds equal. The jog edge lines the beats up.</p><p>This is the hard one. Expect to repeat it.</p>"},{"t":"The TEMPO slider","pre":{"d1":{"track":"A","at":64,"play":false},"d2":{"track":"A","label":"A (copy)","at":64,"play":true},"set":{"hpmix":0},"lit":{"hcue2":1},"listen":"phones"},"demo":[[0,"say","Deck 2 alone."],[2,"move","d2-tempo",0.95,3],[3,"say","Towards you: faster."],[8,"move","d2-tempo",0.05,4],[9,"say","Away: slower."],[14,"move","d2-tempo",0.5,2],[18,"combo","d2-shift","d2-sync"],[18,"say","SHIFT + BEAT SYNC steps the range."]],"len":23,"b":"<p>Towards you is faster. Away is slower.</p><p>[[SHIFT]] + [[BEAT SYNC]] changes the range: ±6, ±10, ±16%, WIDE. Smaller is finer.</p>"},{"t":"Knock it out","lock":1,"pre":{"d1":{"track":"A","at":64,"play":true},"d2":{"track":"A","label":"A (copy)","at":0,"play":true},"set":{"hpmix":0.5},"lit":{"hcue2":1},"listen":"phones"},"demo":[[2,"move","d2-tempo",0.63,1],[4,"say","The kicks start to separate."]],"len":18,"b":"<p>Same track on both decks. Move deck 2’s slider a little and look away.</p>"},{"t":"Fast or slow?","lock":1,"pre":{"d1":{"track":"A","at":64,"play":true},"d2":{"track":"A","label":"A (copy)","at":0.05,"play":true,"tempoV":0.63},"lit":{"hcue2":1},"listen":"phones"},"demo":[[0,"say","Fast or slow? Say it."],[6,"nudge",2,0.12,2],[8,"say","Pushing made it worse. Deck 2 is fast."]],"len":16,"b":"<p>Say it out loud before you touch anything.</p><p>Not sure? Nudge forwards. Better means it was behind. Worse means it was ahead.</p>"},{"t":"Slow it, then nudge","lock":1,"pre":{"d1":{"track":"A","at":64,"play":true},"d2":{"track":"A","label":"A (copy)","at":0.2,"play":true,"tempoV":0.63},"lit":{"hcue2":1},"listen":"phones"},"demo":[[1,"move","d2-tempo",0.53,1],[3,"nudge",2,-0.22,3],[7,"say","Closer. Still drifting, slowly."]],"len":20,"b":"<p>Ease the slider back. Drag the jog edge to line up. Listen again.</p><p>Each round the correction gets smaller.</p>"},{"t":"Locked","lock":1,"pre":{"d1":{"track":"A","at":64,"play":true},"d2":{"track":"A","label":"A (copy)","at":0.06,"play":true,"tempoV":0.53},"lit":{"hcue2":1},"listen":"phones"},"demo":[[1,"move","d2-tempo",0.5,1],[3,"nudge",2,-0.07,2],[6,"say","Hands off. Still together."]],"len":22,"b":"<p>Kicks stay together after you let go: the tempos match.</p><p>Do it ten times.</p>"},{"t":"Now hide the BPM","lock":1,"hideBpm":1,"pre":{"d1":{"track":"A","at":64,"play":true},"d2":{"track":"B","at":0,"play":true},"lit":{"hcue2":1},"listen":"phones"},"demo":[[0,"say","Track B is faster. BPM hidden."],[2,"move","d2-tempo",0.368,4],[7,"nudge",2,-0.064,3],[11,"say","Matched by ear."]],"len":26,"b":"<p>Two house tracks within 3 BPM. Cover the readouts. Match by ear.</p><p>Aim for 30 seconds locked, then 60.</p>"},{"t":"Check yourself","b":"<p>Uncover the BPM. Within 0.1 is a good match.</p>"},{"t":"What BEAT SYNC does","lock":1,"pre":{"d1":{"track":"A","at":64,"play":true},"d2":{"track":"B","at":0.4,"play":true},"lit":{"hcue2":1},"listen":"phones"},"demo":[[0,"say","Out of time, different tempo."],[6,"press","d2-sync"],[7,"say","One press. Matched and snapped."]],"len":16,"b":"<p>One press does both jobs: tempo matched, beats snapped.</p><p>It is only as good as your grids. The manual method saves you when one is wrong.</p>"},{"t":"Pass check","pass":1,"b":"<p>Two different tracks, BPM hidden. Locked for 60 seconds within two minutes of loading.</p>"}],"sub":"Match two tempos by ear"},{"id":"s5","nm":"The blend","init":{"fader1":1},"steps":[{"t":"One track owns the bass","pre":{"d1":{"track":"A","at":64,"play":true},"d2":{"track":"B","at":32,"play":true,"sync":true},"set":{"fader2":0,"low2":0.5},"listen":"room"},"demo":[[2,"move","fader2",1,2],[4,"say","Two basslines: muddy and loud."],[12,"move","low2",0,0.5],[13,"say","Cut one LOW. Clear."]],"len":22,"b":"<p>Two basslines at once sound muddy. Only one track gets the low end.</p><p>Bring B in without bass, swap on a phrase, take A out.</p>"},{"t":"1. Cue B, bass off","pre":{"d1":{"track":"A","at":200,"play":true},"d2":{"track":"B","at":4},"set":{"fader2":0,"low2":0.5}},"demo":[[1,"press","d2-sync"],[3,"press","hcue2"],[5,"scrub",2,0,1.5],[7,"press","d2-cue"],[9,"move","low2",0,1.5]],"len":13,"b":"<p>[[BEAT SYNC]] on. Cue B at its first beat. B’s [[LOW]] fully left, fader down.</p>"},{"t":"2. Start B on the one","lock":1,"pre":{"d1":{"track":"A","at":216,"play":true},"d2":{"track":"B","at":0,"play":false,"sync":true},"set":{"low2":0,"fader2":0},"lit":{"hcue2":1}},"demo":[[0,"say","A’s outro is two bars away. Count it in."],[8,"press","d2-play"],[9,"say","B is running. The room hears nothing new."]],"len":16,"b":"<p>On a one in A, ideally the start of its outro, press [[PLAY/PAUSE]] on B.</p>"},{"t":"3. Raise B","lock":1,"pre":{"d1":{"track":"A","at":224,"play":true},"d2":{"track":"B","at":0,"play":true,"sync":true},"set":{"low2":0,"fader2":0},"lit":{"hcue2":1}},"demo":[[1,"move","fader2",1,30],[4,"say","B’s hats arrive over A’s bass."]],"len":34,"b":"<p>B’s fader to the top, over 8 bars.</p>"},{"t":"4. Swap the bass","lock":1,"pre":{"d1":{"track":"A","at":248,"play":true},"d2":{"track":"B","at":24,"play":true,"sync":true},"set":{"low2":0,"fader2":1}},"demo":[[0,"say","Two bars to the one…"],[8,"move","low1",0,0.25],[8,"move","low2",0.5,0.25],[9,"say","Swapped. The bass is B’s now."]],"len":20,"b":"<p>On the one: A’s [[LOW]] out, B’s [[LOW]] back to 12 o’clock. Same moment, both hands.</p>"},{"t":"5. Take A out","lock":1,"pre":{"d1":{"track":"A","at":0,"play":true},"d2":{"track":"B","at":32,"play":true,"sync":true},"set":{"low1":0,"low2":0.5,"fader1":1,"fader2":1}},"demo":[[1,"move","fader1",0,30]],"len":34,"b":"<p>A’s fader down, over 8 bars.</p>"},{"t":"Reset A","pre":{"d1":{"track":"A","at":32,"play":true},"d2":{"track":"B","at":64,"play":true,"sync":true},"set":{"fader1":0,"low1":0,"fader2":1,"low2":0.5}},"demo":[[1,"move","low1",0.5,1],[3,"press","d1-play"]],"len":8,"b":"<p>A’s [[LOW]] back to 12 o’clock and stop the deck. Ready for the next track.</p>"},{"t":"The whole blend","lock":1,"pre":{"d1":{"track":"A","at":216,"play":true},"d2":{"track":"B","at":0,"play":false,"sync":true},"set":{"fader1":1,"fader2":0,"low1":0.5,"low2":0},"lit":{"hcue2":1}},"demo":[[0,"say","One take."],[8,"press","d2-play"],[8,"say","Start B on the one."],[9,"move","fader2",1,30],[12,"say","Raise B over 8 bars."],[40,"move","low1",0,0.25],[40,"move","low2",0.5,0.25],[40,"say","Swap the bass on the one."],[41,"move","fader1",0,30],[44,"say","Take A out over 8 bars."],[72,"move","low1",0.5,1],[74,"press","d1-play"],[74,"say","Reset A. Done."]],"len":80,"b":"<p>All five moves in one take. Watch where each lands on the bar numbers.</p>"},{"t":"Drill it","b":"<ul class=\"todo\"><li>Ten times with sync on. Hot cues take you back to A’s outro.</li><li>Five times with sync off.</li><li>Change one thing each time: a 16-bar fade, a slower bass swap, a small MID cut.</li></ul>"},{"t":"Record one","b":"<p>Open REC in rekordbox. Record one blend and listen with your hands off. Note the weakest moment.</p><p class=\"fine\">Recording needs files you own.</p>"},{"t":"Smart Fader","pre":{"d1":{"track":"A","at":224,"play":true},"d2":{"track":"B","at":0,"play":true},"set":{"fader1":1,"fader2":1,"xfader":0,"low1":0.5,"low2":0.5},"lit":{"hcue2":0}},"demo":[[1,"press","smartfader"],[3,"move","xfader",1,16],[4,"say","One hand. It swaps the bass for you."],[21,"press","smartfader"]],"len":24,"b":"<p>[[SMART FADER]] does the blend from the crossfader alone: sync, BPM and bass swap.</p><p>Listen, turn it off, then copy it by hand.</p>"},{"t":"Pass check","pass":1,"b":"<p>A recorded blend. The kick never doubles, the bass never comes from both, the volume stays steady.</p>"}],"sub":"Your first transition"},{"id":"s6","nm":"Loops and jumps","init":{"fader1":1},"steps":[{"t":"Buy time, fix timing","b":"<p>A loop repeats a section for as long as you need.</p><p>Beat jump moves the playhead without breaking the rhythm.</p>"},{"t":"A 4-beat loop","pre":{"d1":{"track":"A","at":62,"play":true},"d2":null},"demo":[[2,"press","d1-4beat"],[3,"say","The same 4 beats. Shaded on the strip."],[14,"press","d1-4beat"],[14,"say","Pressed again. The track carries on."]],"len":22,"b":"<p>Press [[4 BEAT/EXIT]]. The next 4 beats repeat until you press it again.</p>"},{"t":"Halve and double","pre":{"d1":{"track":"A","at":62,"play":true},"d2":null},"demo":[[2,"press","d1-4beat"],[6,"press","d1-call-r"],[6,"say","Doubled to 8 beats."],[14,"press","d1-call-l"],[14,"say","Halved to 4…"],[18,"press","d1-call-l"],[18,"say","2…"],[20,"press","d1-call-l"],[20,"say","1."],[22,"press","d1-4beat"],[22,"say","And out."]],"len":28,"b":"<p>In a loop, [[CALL ►]] doubles it and [[CALL ◄]] halves it.</p><p>[[IN]] and [[OUT]] set one by hand.</p>"},{"t":"Extend an outro","pre":{"d1":{"track":"A","at":244,"play":true},"d2":{"track":"B","at":0,"play":false,"sync":true},"set":{"fader1":1,"fader2":0,"low1":0.5,"low2":0}},"demo":[[4,"press","d1-4beat"],[4.6,"press","d1-call-r"],[5,"say","A’s last two bars are looping."],[12,"press","d2-play"],[13,"move","fader2",1,14],[28,"move","low1",0,0.25],[28,"move","low2",0.5,0.25],[36,"press","d1-4beat"],[36,"move","fader1",0,3],[37,"say","Released. A runs out."]],"len":42,"b":"<p>In A’s last bars: [[4 BEAT/EXIT]], then [[CALL ►]]. Blend B in over the loop.</p><p>Press [[4 BEAT/EXIT]] again to let A go.</p>"},{"t":"Hold an intro","pre":{"d1":{"track":"A","at":200,"play":true},"d2":{"track":"B","at":0,"play":false,"sync":true},"set":{"fader1":1,"fader2":0,"low1":0.5,"low2":0.5,"hpmix":0.5,"hplevel":0.5},"lit":{"hcue2":1},"listen":"phones"},"demo":[[0,"say","Headphones: B’s first 4 beats, looping."],[4,"press","d2-play"],[4,"press","d2-4beat"],[24,"say","A’s next phrase. Release in its first bar."],[25,"press","d2-4beat"],[28,"say","Bar 2 lands on bar 2. Aligned."]],"len":34,"b":"<p>Loop B’s first 4 beats in your headphones while you get ready.</p><p>Release in the first bar of A’s next phrase.</p>"},{"t":"Beat jump pads","pre":{"d1":{"track":"A","at":64,"play":true},"d2":{"track":"B","at":32,"play":true,"sync":true},"set":{"fader2":1,"low2":0},"lit":{"hcue2":0},"listen":"room"},"demo":[[1,"press","d2-mode-beatjump"],[4,"press","d2-pad6"],[4,"say","Pad 6: forward 4."],[8,"press","d2-pad5"],[8,"say","Pad 5: back 4."],[12,"press","d2-pad8"],[12,"say","Pad 8: forward 8. Still in rhythm."]],"len":18,"b":"<p>Press [[BEAT JUMP]]. Odd pads jump back, even pads forward.</p><div class=\"padmap\"><span>◄ 1</span><span>1 ►</span><span>◄ 2</span><span>2 ►</span><span>◄ 4</span><span>4 ►</span><span>◄ 8</span><span>8 ►</span></div><p class=\"fine\">[[SHIFT]] + pad 7 or 8 changes the sizes.</p>"},{"t":"One bar late","lock":1,"pre":{"d1":{"track":"A","at":220,"play":true},"d2":{"track":"B","at":0,"play":false,"sync":true,"mode":"beatjump"},"set":{"fader2":1,"low2":0}},"demo":[[4,"say","The one… missed it."],[8,"press","d2-play"],[9,"say","A bar late. Beats match, phrases don’t."]],"len":18,"b":"<p>B started a bar late. The beats match, the phrases do not.</p><p>Compare the bar numbers on the strip.</p>"},{"t":"Fix it with one pad","lock":1,"pre":{"d1":{"track":"A","at":230,"play":true},"d2":{"track":"B","at":2,"play":true,"sync":true,"mode":"beatjump"},"set":{"fader2":1,"low2":0}},"demo":[[4,"press","d2-pad6"],[5,"say","Forward 4. Aligned."]],"len":14,"b":"<p>Pad 6 jumps B forward 4 beats. Phrases aligned, rhythm unbroken.</p><p>A bar early? Pad 5 jumps back.</p>"},{"t":"Count back from a drop","pre":{"d1":{"track":"A","at":0,"play":false},"d2":{"track":"B","at":0,"play":false,"sync":true,"hot":{"3":160}},"set":{"fader1":0,"fader2":1,"low2":0.5}},"demo":[[1,"press","d2-pad3"],[1,"say","Pad 3: the drop."],[3,"press","d2-mode-beatjump"],[4,"press","d2-pad7"],[5,"press","d2-pad7"],[5,"say","Pad 7: back 8 beats each press."],[6,"press","d2-pad7"],[7,"press","d2-pad7"],[8,"press","d2-pad7"],[9,"press","d2-pad7"],[10,"press","d2-pad7"],[11,"press","d2-pad7"],[12,"press","d2-pad7"],[13,"press","d2-pad7"],[14,"press","d2-mode-hotcue"],[14,"say","Wait for the one…"],[17,"press","d2-pad5"],[17,"say","16 bars before the drop. Stored on pad 5."]],"len":22,"b":"<p>Jump to the drop on pad 3. In [[BEAT JUMP]], pad 7 hops back 8 beats. Four presses is one phrase.</p><p>Store the one that sits 16 bars before the drop on pad 5.</p>"},{"t":"Beat loop pads","pre":{"d1":{"track":"A","at":172,"play":true},"d2":null,"set":{"fader1":1,"fader2":0}},"demo":[[1,"combo","d1-shift","d1-mode-beatjump"],[4,"press","d1-pad5"],[4,"say","4 beats…"],[8,"press","d1-pad4"],[8,"say","2…"],[10,"press","d1-pad3"],[10,"say","1…"],[11,"press","d1-pad2"],[11,"say","a half…"],[12,"press","d1-pad2"],[12,"say","and out, on the beat."]],"len":18,"b":"<p>[[SHIFT]] + [[BEAT JUMP]] turns the pads into loop lengths. Press a pad again to exit.</p><div class=\"padmap\"><span>1/4</span><span>1/2</span><span>1</span><span>2</span><span>4</span><span>8</span><span>16</span><span>32</span></div>"},{"t":"Pass check","pass":1,"b":"<p>Start a blend one bar late on purpose. Fix it with one pad. Both tracks change phrase together.</p>"}],"sub":"Buy time, fix timing"},{"id":"s7","nm":"Effects","init":{"fader1":1},"steps":[{"t":"Short, in time, on a phrase","b":"<p>That is the whole rule.</p><p>Three moves cover most needs: a filter sweep, an echo-out and one Smart CFX preset.</p>"},{"t":"The BEAT FX strip","pre":{"d1":{"track":"A","at":160,"play":false},"d2":{"track":"B","at":0,"play":false,"sync":true}},"demo":[[1,"touch","fx-select",1],[1,"say","FX SELECT picks the effect."],[3,"touch","fx-ch",1],[3,"say","CH SELECT: channel 1, 2 or both."],[5,"touch","fx-beat-l",0.7],[6,"touch","fx-beat-r",0.7],[5,"say","BEAT: its length in beats."],[8,"touch","fx-depth",1],[8,"say","LEVEL/DEPTH: its strength."],[10,"touch","fx-onoff",1],[10,"say","ON/OFF fires it."]],"len":13,"b":"<ul><li>[[FX SELECT]] picks the effect</li><li>[[CH SELECT]] picks the channel</li><li>[[BEAT ◄ ►]] sets its length</li><li>[[LEVEL/DEPTH]] sets its strength</li><li>[[ON/OFF]] fires it</li></ul>"},{"t":"Filter out: sweep","pre":{"d1":{"track":"A","at":208,"play":true},"d2":{"track":"B","at":0,"play":false,"sync":true},"set":{"fader1":1,"fader2":0,"low2":0.5,"cfx1":0.5}},"demo":[[0,"move","cfx1",0.92,15],[2,"say","Slowly right. The bass drains away."],[16,"move","cfx1",0.5,0.5]],"len":20,"b":"<p>Last 4 bars of a phrase: turn A’s [[CFX]] slowly right until it sounds thin.</p>"},{"t":"Filter out: drop","pre":{"d1":{"track":"A","at":208,"play":true},"d2":{"track":"B","at":0,"play":false,"sync":true},"set":{"fader1":1,"fader2":1,"low2":0.5,"cfx1":0.5}},"demo":[[0,"move","cfx1",0.92,15],[16,"move","fader1",0,0.2],[16,"press","d2-play"],[16.4,"move","cfx1",0.5,0.6],[17,"say","On the one: A out, B in at full weight."]],"len":26,"b":"<p>On the one: A’s fader down, knob back to centre, B in.</p>"},{"t":"Filter in","pre":{"d1":{"track":"A","at":224,"play":true},"d2":{"track":"B","at":0,"play":false,"sync":true},"set":{"fader1":1,"fader2":1,"cfx2":0.9,"cfx1":0.5,"low2":0.5}},"demo":[[0,"press","d2-play"],[1,"move","cfx2",0.5,30],[1,"move","fader1",0,30],[3,"say","B opens up as A fades."]],"len":34,"b":"<p>The reverse. Start B with [[CFX]] turned right, and open it over 8 bars as A fades.</p>"},{"t":"Echo-out: set up","pre":{"d1":{"track":"A","at":160,"play":true},"d2":{"track":"B","at":0,"play":false,"sync":true},"set":{"fader1":1,"fader2":0,"cfx2":0.5,"fx-ch":0.5}},"demo":[[1,"press","fx-select"],[1,"say","Pick ECHO. rekordbox shows the name."],[4,"move","fx-ch",0,0.5],[5,"say","CH SELECT to channel 1."],[7,"press","fx-beat-l"],[9,"press","fx-beat-r"],[9,"say","Beat value: 1."]],"len":12,"b":"<p>[[FX SELECT]] to ECHO. [[CH SELECT]] to A’s channel. [[BEAT ◄ ►]] to 1.</p>"},{"t":"Echo-out: fire","pre":{"d1":{"track":"A","at":184,"play":true},"d2":{"track":"B","at":0,"play":false,"sync":true},"set":{"fader1":1,"fader2":1,"low2":0.5,"fx-ch":0}},"demo":[[0,"say","Last bars of the phrase…"],[7,"press","fx-onoff"],[7.85,"move","fader1",0,0.15],[8,"press","d2-play"],[8,"say","A echoes away over B."],[16,"press","fx-onoff"]],"len":22,"b":"<p>Last beat of A’s phrase: [[ON/OFF]], A’s fader down, start B on the one.</p><p>Turn it off when the tail fades.</p>"},{"t":"Smart CFX","pre":{"d1":{"track":"A","at":160,"play":true},"d2":null,"set":{"fader1":1,"cfx1":0.5}},"demo":[[1,"combo","d1-shift","smartcfx"],[1,"say","SHIFT + SMART CFX opens the preset list."],[4,"press","smartcfx"],[8,"move","cfx1",0.95,7],[9,"say","One knob, a chain of effects."],[16,"move","cfx1",0.5,0.4],[20,"press","smartcfx"]],"len":24,"b":"<p>[[SHIFT]] + [[SMART CFX]] opens the presets in rekordbox. Pick an echo.</p><div class=\"tags\"><span>PHANTOM ECHO</span><span>REFLECT ECHO</span><span>MOBIUS ECHO</span><span>VAPORIZE</span><span>NOISE CHOPPER</span><span>CYBER JET</span><span>CYBER PITCH</span><span>TWISTER</span></div><p>Turn it on, sweep [[CFX]] through the last 2 bars, centre it on the one.</p>"},{"t":"Pad FX","pre":{"d1":{"track":"A","at":160,"play":true},"d2":null,"set":{"fader1":1}},"demo":[[1,"press","d1-mode-padfx"],[4,"hold","d1-pad1",2],[4,"say","Held: on."],[6,"say","Released: off."],[8,"hold","d1-pad2",3]],"len":14,"b":"<p>Press [[PAD FX1]]. An effect lasts only while you hold the pad, so it is hard to overuse.</p>"},{"t":"One per transition","b":"<p>Record three transitions with exactly one effect each. Listen back.</p>"},{"t":"Pass check","pass":1,"b":"<p>An echo-out whose tail lands in time, with the next track clean on the one.</p>"}],"sub":"Filter, echo, Smart CFX"},{"id":"s8","nm":"Long blends","init":{"fader1":1},"steps":[{"t":"Keys have to agree","pre":{"d1":{"track":"A","at":160,"play":true},"d2":{"track":"B","at":160,"play":true,"sync":true},"set":{"fader2":0,"low2":0}},"demo":[[2,"move","fader2",1,2],[5,"say","Compatible keys. The melodies sit together."]],"len":20,"b":"<p>In a long blend two melodies play together, so their notes must fit. rekordbox shows each track’s key.</p><p>Compatible: the same code, one number up or down, or the other letter.</p><div class=\"tags\"><span class=\"q\">8A goes with</span><span>8A</span><span>7A</span><span>9A</span><span>8B</span></div><p class=\"fine\">Preferences &gt; View &gt; key display: Alphanumeric.</p>"},{"t":"Hear a clash","pre":{"d1":{"track":"A","at":160,"play":true},"d2":{"track":"B","at":160,"play":true,"sync":true,"tr":1},"set":{"fader2":0,"low2":0}},"demo":[[2,"move","fader2",1,2],[5,"say","One semitone apart. Sour."],[14,"move","fader2",0,1]],"len":18,"b":"<p>The same two tracks, one shifted a semitone. It turns sour.</p><p>Turn Master Tempo on (MT) so tempo changes do not shift the pitch.</p>"},{"t":"Blends by style","b":"<div class=\"tw\"><table class=\"st\"><tr><th>Style</th><th>BPM</th><th>Blend</th></tr><tr><td>House</td><td>120–128</td><td>16 to 32 bars, bass swap on a phrase</td></tr><tr><td>Techno</td><td>128–140</td><td>32 bars or more, slow EQ</td></tr><tr><td>Afrobeats</td><td>95–115</td><td>4 to 8 bars over a loop</td></tr><tr><td>Amapiano</td><td>108–115</td><td>Long, swap as the log drum lands</td></tr></table></div><p class=\"fine\">Typical ranges. The demos use the house tracks.</p>"},{"t":"Pair your tracks","b":"<p>Sort Practice by BPM. Give each track a partner within 4 BPM, in a compatible key.</p>"},{"t":"Long blend: bring B in","lock":1,"pre":{"d1":{"track":"A","at":224,"play":true},"d2":{"track":"B","at":0,"play":false,"sync":true},"set":{"fader1":1,"fader2":0,"low2":0,"low1":0.5,"hi1":0.5,"mid1":0.5}},"demo":[[0,"press","d2-play"],[1,"move","fader2",1,60],[4,"say","Sixteen bars. No hurry."]],"len":66,"b":"<p>Start B at A’s outro with its [[LOW]] cut. Raise the fader over 16 bars.</p>"},{"t":"Long blend: swap the bass","lock":1,"pre":{"d1":{"track":"A","at":24,"play":true},"d2":{"track":"B","at":56,"play":true,"sync":true},"set":{"fader1":1,"fader2":1,"low2":0,"low1":0.5}},"demo":[[8,"move","low1",0,0.25],[8,"move","low2",0.5,0.25],[9,"say","On the one, as before."]],"len":16,"b":"<p>On the one, swap the [[LOW]] knobs.</p>"},{"t":"Long blend: thin A out","pre":{"d1":{"track":"A","at":32,"play":true},"d2":{"track":"B","at":64,"play":true,"sync":true},"set":{"low1":0,"low2":0.5,"fader2":1,"fader1":1,"hi1":0.5,"mid1":0.5}},"demo":[[1,"move","hi1",0.05,14],[2,"say","HI first…"],[17,"move","mid1",0.08,14],[18,"say","then MID…"],[33,"move","fader1",0,28],[34,"say","then the fader."]],"len":64,"b":"<p>Over 16 bars: [[HI]], then [[MID]], then the fader.</p>"},{"t":"Afrobeats: loop and release","pre":{"d1":{"track":"A","at":244,"play":true},"d2":{"track":"B","at":0,"play":false,"sync":true},"set":{"fader1":1,"fader2":1,"low1":0.5,"low2":0.5,"hi1":0.5,"mid1":0.5}},"demo":[[4,"press","d1-4beat"],[5,"say","Loop A’s last beats."],[8,"press","d2-play"],[8,"move","low1",0,0.25],[16,"press","d1-4beat"],[16,"move","fader1",0,0.5],[17,"say","Released before B’s melody."]],"len":24,"b":"<p>Short intros. Loop A’s last instrumental beats, start B, and let A go before B’s vocal.</p><p>Never two lead vocals at once.</p>"},{"t":"Amapiano: the log drum","pre":{"d1":{"track":"A","at":240,"play":true},"d2":{"track":"B","at":16,"play":true,"sync":true},"set":{"fader1":1,"fader2":1,"low1":0.5,"low2":0}},"demo":[[0,"say","B’s intro runs under A. No bass yet."],[16,"move","low1",0,0.25],[16,"move","low2",0.5,0.25],[17,"say","Swapped as B’s bass arrives."],[20,"move","fader1",0,8]],"len":32,"b":"<p>Run B’s long intro under A. Swap the bass on the phrase where B’s log drum lands.</p>"},{"t":"Pass check","pass":1,"b":"<p>Three blends in a row, 16 bars or longer. No doubled bass, no clashing vocals, no sour notes.</p>"}],"sub":"House, techno, afrobeats, amapiano"},{"id":"s9","nm":"Quick mixes","init":{"fader1":1},"steps":[{"t":"Short tracks, fast changes","b":"<p>Hip-hop, R&amp;B, pop and Latin are short and vocal-led. Change at the end of a hook.</p><div class=\"tw\"><table class=\"st\"><tr><th>Style</th><th>BPM</th><th>Transition</th></tr><tr><td>Hip-hop</td><td>80–100</td><td>Cut on the one, or echo-out</td></tr><tr><td>R&amp;B</td><td>60–100</td><td>Echo-out, or fade under a breakdown</td></tr><tr><td>Pop</td><td>100–130</td><td>4 to 8 bars after a chorus</td></tr><tr><td>Reggaeton</td><td>88–100</td><td>4 to 8 bars on the drums</td></tr></table></div><p class=\"fine\">Typical ranges. Trap at 130–160 often feels like half that.</p>"},{"t":"Crossing a tempo gap","b":"<ul><li><b>Up to 6%</b> Ride it. Match B to A, blend, ease B back.</li><li><b>Double or half</b> Beatmatch as they are: 70 fits 140.</li><li><b>Anything else</b> Break the beat. Echo-out or cut, then start B on the one.</li></ul>"},{"t":"The cut: set up","pre":{"d1":{"track":"C","at":40,"play":true},"d2":{"track":"D","at":0},"set":{"fader1":1,"fader2":0,"xfader":0.5}},"demo":[[1,"move","xfader",0,1],[3,"move","fader2",1,1],[5,"press","d2-cue"]],"len":9,"b":"<p>Crossfader fully on A’s side, both faders up. Cue B on its first beat.</p>"},{"t":"The cut: go","pre":{"d1":{"track":"C","at":56,"play":true},"d2":{"track":"D","at":0},"set":{"xfader":0,"fader1":1,"fader2":1}},"demo":[[0,"say","Two bars to the one…"],[8,"press","d2-play"],[8,"move","xfader",1,0.12],[9,"say","PLAY and crossfader, one movement."]],"len":18,"b":"<p>On the one: [[PLAY/PAUSE]] on B and snap the crossfader across. One movement.</p><p>Do 20.</p>"},{"t":"Fader Start","pre":{"d1":{"track":"C","at":56,"play":true},"d2":{"track":"D","at":0},"set":{"xfader":0,"fader1":1,"fader2":1}},"demo":[[7,"hold","d1-shift",2],[8,"move","xfader",1,0.15],[8,"do","play",2],[9,"say","SHIFT held. The crossfader started deck 2."]],"len":18,"b":"<p>Hold [[SHIFT]] and move the crossfader. B starts from its cue point by itself.</p><p class=\"fine\">Nothing? Turn Fader Start on in Preferences &gt; Controller &gt; Mixer.</p>"},{"t":"Echo-out drop","pre":{"d1":{"track":"C","at":56,"play":true},"d2":{"track":"A","at":64,"play":false},"set":{"xfader":0.5,"fader1":1,"fader2":1,"fx-ch":0}},"     unsupported:'This browser can’t read MIDI controllers (Safari can’t). Open the page in Chrome or Edge.'
  }[s];
  $('#mConnect').hidden = s === 'on' || s === 'unsupported';
  $('#mFlip').setAttribute('aria-checked', String(!!store.midiFlip));
  lastEl.textContent = MD.last || 'Touch any control and its message shows here.';
}
function openM(on) { mSheet.hidden = scrim.hidden = !on; mBtn.setAttribute('aria-expanded', String(on)); if (on) { sheet.hidden = true; midiUi(); } }
mBtn.addEventListener('click', () => { AE.ensure(); if (MD.st === 'off') midiConnect(); else openM(mSheet.hidden); });
scrim.addEventListener('click', () => openM(false));
$('#mConnect').addEventListener('click', () => { AE.ensure(); midiConnect(); });
$('#mFlip').addEventListener('click', () => { store.midiFlip = !store.midiFlip; save(); midiUi(); });
$('#mReset').addEventListener('click', () => { store.midiMap = {}; save(); buildMap(); say('Mapping reset', 'Back to the built-in FLX4 map.'); openM(false); });
$('#mLearn').addEventListener('click', () => learnStart());

/* ---------- re-map: click a control on screen, then touch it on the FLX4 ---------- */
const Learn = {on:false, id:null};
function learnStart() { openM(false); stopDemo(); Learn.on = true; Learn.id = null; svg.classList.add('learn'); inspect(null); setHL([]); say('Re-map a control', 'Click it on the screen panel. Esc cancels.'); }
function learnEnd() { Learn.on = false; Learn.id = null; svg.classList.remove('learn'); setHL(Dr.on ? [] : curHL()); }
function learnPick(id) {
  const o = C[id]; if (!o || o.t === 'meter') return;
  Learn.id = id; setHL([id]);
  say(nameOf(id), /knob|fade|slide/.test(o.t) ? 'Now move it on your FLX4.' : /ring|jog|enc/.test(o.t) ? 'Now turn it on your FLX4.' : 'Now press it on your FLX4. Hold SHIFT with it to map its second function.');
}
function learnMsg(key, cc, a, v, down, cur, ch) {
  if (cur && cur.k === 'shift') { hwShift[cur.n] = down; return; }
  lastEl.textContent = MD.last = rawTxt(ch, cc, a, v);
  const id = Learn.id; if (!id) return;
  const o = C[id], t = o.t, sh = hwShift[1] || hwShift[2] ? 1 : 0; let ent = null;
  if (/knob|fade|slide/.test(t)) { if (cc && !(a >= 0x20 && a < 0x40)) ent = {k:'abs', id:id}; }
  else if (/ring|jog|enc/.test(t)) { if (cc) ent = id === 'browse' ? {k:'rel', id:id, sh:sh} : {k:'rel', id:id, n:+id[1], sh:sh}; }
  else if (down) ent = o.pad ? {k:'pad', n:o.dk, pad:o.pad, mode:AE.D[o.dk].mode, sh:sh} : /shift$/.test(id) ? {k:'shift', id:id, n:+id[1]} : t === 'sw3' ? {k:'swc', id:id} : {k:'btn', id:id, sh:sh};
  if (!ent) return;
  store.midiMap = store.midiMap || {}; store.midiMap[key] = ent; save(); buildMap();
  const nm = mName(ent); learnEnd(); say('Mapped', nm + '  ←  ' + rawTxt(ch, cc, a, v));
}

/* ---------- keys ---------- */
document.addEventListener('keydown', e => {
  if (e.key === 'Shift') { if (trying && !shiftKey) { shiftKey = true; paintShift(); } return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!sheet.hidden) { if (e.key === 'Escape') { openSheet(false); menuBtn.focus(); } return; }
  if (!mSheet.hidden) { if (e.key === 'Escape') { openM(false); mBtn.focus(); } return; }
  if (Learn.on && e.key === 'Escape') { learnEnd(); say('', ''); return; }
  const t = e.target && e.target.tagName; if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (e.key === ' ' && t !== 'BUTTON') { e.preventDefault(); if (!trying) playOrPause(); }
  else if (e.key === 'Escape') inspect(null);
});
document.addEventListener('keyup', e => { if (e.key === 'Shift' && shiftKey) { shiftKey = false; if (trying) paintShift(); } });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (Demo.on && !paused) togglePause(); else if (trying && !tryPaused) { tryPaused = true; AE.pause(); } }
  else if (tryPaused) { tryPaused = false; AE.resume(); }
});

/* ---------- start ---------- */
buildMap(); midiUi();
document.addEventListener('pointerdown', () => { AE.ensure(); }, {once:true});
if (store.midiAuto && navigator.requestMIDIAccess) {
  const q = navigator.permissions && navigator.permissions.query ? navigator.permissions.query({name:'midi'}).then(r => r.state, () => 'granted') : Promise.resolve('granted');
  q.then(s => { if (s === 'granted') midiConnect(); });
}
sizeCanvas();
if (window.ResizeObserver) new ResizeObserver(sizeCanvas).observe(cv); else window.addEventListener('resize', sizeCanvas);
go(si, ki);
firstRun = false;
requestAnimationFrame(frame);
if (goNow === '-go') startDemo(); else if (goNow === '-try') startTry();
})();
</script>

</body></html>
